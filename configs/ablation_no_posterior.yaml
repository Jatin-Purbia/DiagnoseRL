# Ablation: identical to configs/full.yaml except the Bayesian posterior is removed from the
# observation (the agent sees only raw test outcomes, spend and remaining steps).
#   python -m diagnoserl.training.train --config configs/ablation_no_posterior.yaml --seed 0 \
#       --run-name ablation_noposterior_seed0
scenario: standard
include_posterior: false
seed: 0
total_timesteps: 2000000
n_envs: 8
n_steps: 128
batch_size: 256
n_epochs: 10
learning_rate: 0.0005
gamma: 1.0
ent_coef: 0.05
net_arch: [128, 128]
eval_freq: 50000
checkpoint_freq: 250000
n_val_episodes: 500
output_dir: artifacts/runs
mlflow: false
