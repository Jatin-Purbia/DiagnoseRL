# Fast smoke-training config for CI and quick checks. NOT a benchmark run:
# far too short for the agent to converge. Use configs/full.yaml for experiments.
scenario: small
run_name: smoke
seed: 0
total_timesteps: 8192
n_envs: 4
n_steps: 128
batch_size: 128
eval_freq: 4096
checkpoint_freq: 4096
n_val_episodes: 100
output_dir: artifacts/runs
mlflow: false
