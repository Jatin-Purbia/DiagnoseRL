name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: |
          pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt -r requirements-api.txt
          pip install --no-deps -e .
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check src tests
      - name: Type check (mypy --strict)
        run: mypy src
      - name: Tests
        run: pytest -q
      - name: Migrations apply cleanly and match the models
        env:
          DIAGNOSERL_DATABASE_URL: sqlite:///ci_migration.db
        run: |
          alembic upgrade head
          alembic check
      # Fast smoke training (seconds). Full experiments are intentionally not run in CI.
      - name: Smoke training
        run: python -m diagnoserl.training.train --config configs/smoke.yaml

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [python, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        env:
          POSTGRES_PASSWORD: ci-only-not-a-secret
          DIAGNOSERL_ADMIN_API_KEY: ci-only-not-a-secret
        run: docker compose config -q
      - name: Build backend image
        run: docker build -t diagnoserl-backend:ci .
      - name: Build frontend image
        run: docker build -t diagnoserl-frontend:ci frontend
